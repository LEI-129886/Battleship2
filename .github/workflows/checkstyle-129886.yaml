# 129886 - Miguel Santos
name: Checkstyle naming gate 129886

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Checkstyle
        run: |
          curl -L -o checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.4/checkstyle-10.21.4-all.jar

      - name: Run Checkstyle
        run: java -jar checkstyle.jar -c checkstyle-129886.xml src