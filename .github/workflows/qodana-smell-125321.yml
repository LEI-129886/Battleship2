# 125321
name: Qodana smell gate 125321
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --config qodana-125321.yaml
            --profile-path /data/project/.qodana/profiles/profile-125321.yaml
          use-annotations: true
          post-pr-comment: true