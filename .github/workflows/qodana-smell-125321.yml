#125321
name: Qodana code smell 125321
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-parameter-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail on methods/constructors with more than 4 parameters
        run: python .github/scripts/check_params.py --max 4 --exclude "src/test,generated"
