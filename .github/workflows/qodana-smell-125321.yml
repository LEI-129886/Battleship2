#125321
name: Qodana code smell 125321
on:
  pull_request:

permissions:
  contents: read

jobs:
  long-parameter-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail on changed methods/constructors with more than 4 parameters
        run: |
          python .github/scripts/check_params.py \
            --max 4 \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --exclude "src/test,generated"
