# 129886 - Miguel Matos
name: Qodana - Feature Envy gate 129886

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # necessário para o modo pull request
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129886.yaml
          pr-mode: true
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}