# 129886 - Miguel Matos
name: Qodana - Feature Envy gate 129886

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # necessário para o modo pull request
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129886.yaml
          pr-mode: true
          use-annotations: true
