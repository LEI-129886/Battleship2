# 129886 - Miguel Matos
name: Qodana - Feature Envy gate 129886

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para o modo pull request
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: true
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}