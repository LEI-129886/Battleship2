# ... (mantenha o início igual)
- name: Configurar o Java (JDK 21)
  uses: actions/setup-java@v4
  with:
    java-version: '21' # Alterado de 17 para 21
    distribution: 'temurin'
    cache: 'maven'

- name: Configurar ambiente do GitHub Pages
  uses: actions/configure-pages@v5

- name: Gerar Site com o Maven
  run: mvn clean site

- name: Compactar os arquivos gerados
  uses: actions/upload-pages-artifact@v3
  with:
    path: './docs' # Alterado de ./target/site para ./docs (onde o seu pom.xml guarda o site)

- name: Publicar no GitHub Pages Oficial
  id: deployment
  uses: actions/deploy-pages@v4
